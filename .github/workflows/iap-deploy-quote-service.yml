# Deploy IAP quote-service to Cloud Run (fixes SKUs, schema migrations, etc.) — no PC.
name: Deploy IAP quote-service

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip npm test before deploy
        required: false
        default: false
        type: boolean
      skip_register:
        description: Skip POST /auth/services (image only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: securedbackend-production
  GCP_WIF_PROVIDER: projects/248381849073/locations/global/workloadIdentityPools/iap-cloud-agent-1/providers/github
  GCP_SERVICE_ACCOUNT: iap-cloud-agent-deploy@securedbackend-production.iam.gserviceaccount.com
  IAP_TENANT_ID: 987bcdaf-320d-46bf-bfb3-4bdcdffe1de1
  IAP_TENANT_SLUG: cadel-7414

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout in_a_pinch
        uses: actions/checkout@v4

      - name: Checkout symlfy-baas
        uses: actions/checkout@v4
        with:
          repository: bengrisinger-lgtm/symlfy-baas
          path: symlfy-baas
          token: ${{ secrets.SYMLFY_BAAS_GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Verify layout
        env:
          SYMLFY_BAAS_ROOT: ${{ github.workspace }}/symlfy-baas
        run: bash scripts/verify-symlfy-baas-layout.sh "$SYMLFY_BAAS_ROOT"

      - name: Deploy quote-service
        env:
          SYMLFY_BAAS_ROOT: ${{ github.workspace }}/symlfy-baas
          IAP_TENANT_ID: ${{ env.IAP_TENANT_ID }}
          IAP_TENANT_SLUG: ${{ env.IAP_TENANT_SLUG }}
          QUOTE_SKIP_TESTS: ${{ inputs.skip_tests && '1' || '0' }}
          QUOTE_SKIP_REGISTER: ${{ inputs.skip_register && '1' || '0' }}
          # WIF deploy SA must not need secretmanager.secrets.create (secret exists from PC deploy).
          QUOTE_ALLOW_HMAC_CREATE: "0"
          QUOTE_SKIP_SECRET_IAM: "1"
        run: bash scripts/iap-deploy-quote-service.sh
