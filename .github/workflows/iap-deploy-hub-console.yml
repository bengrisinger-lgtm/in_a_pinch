# Hub /console/ overlay — same as storefront/build-console-overlay.ps1 + deploy.ps1 console rsync.
name: Deploy IAP hub console overlay

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: securedbackend-production
  GCP_WIF_PROVIDER: projects/248381849073/locations/global/workloadIdentityPools/iap-cloud-agent-1/providers/github
  GCP_SERVICE_ACCOUNT: iap-cloud-agent-deploy@securedbackend-production.iam.gserviceaccount.com
  IAP_TENANT_SLUG: cadel-7414
  IAP_ROOT: micro-applications/in-a-pinch

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout in_a_pinch (monorepo path)
        uses: actions/checkout@v4
        with:
          path: micro-applications/in-a-pinch

      - name: Checkout symlfy-baas
        uses: actions/checkout@v4
        with:
          repository: bengrisinger-lgtm/symlfy-baas
          path: symlfy-baas
          token: ${{ secrets.SYMLFY_BAAS_GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify symlfy-baas layout
        run: bash "${{ env.IAP_ROOT }}/scripts/verify-symlfy-baas-layout.sh" "${{ github.workspace }}/symlfy-baas"

      - name: Build console overlay (build-console-overlay.ps1)
        env:
          SYMLFY_BAAS_ROOT: ${{ github.workspace }}/symlfy-baas
        run: bash "${{ env.IAP_ROOT }}/scripts/iap-build-console-overlay.sh"

      - name: Upload hub /console/
        run: |
          BUCKET="gs://${GCP_PROJECT}-ta-${IAP_TENANT_SLUG}-hub-app"
          gcloud storage rsync --recursive --delete-unmatched-destination-objects \
            "${{ env.IAP_ROOT }}/storefront/console-dist" "$BUCKET/console"
