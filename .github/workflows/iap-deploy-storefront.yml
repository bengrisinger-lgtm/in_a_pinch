# Deploy IAP storefront to GCS (hub + apex). Layout mirrors local PC:
#   <root>/symlfy-baas
#   <root>/micro-applications/in-a-pinch/storefront  (file:../../../symlfy-baas/...)
# Same steps as storefront/deploy.ps1 -Build + rsync (no extra client-sdk rebuild).
name: Deploy IAP storefront

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to upload
        required: true
        default: both
        type: choice
        options:
          - both
          - hub
          - apex
permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: securedbackend-production
  GCP_WIF_PROVIDER: projects/248381849073/locations/global/workloadIdentityPools/iap-cloud-agent-1/providers/github
  GCP_SERVICE_ACCOUNT: iap-cloud-agent-deploy@securedbackend-production.iam.gserviceaccount.com
  IAP_TENANT_SLUG: cadel-7414
  IAP_ROOT: micro-applications/in-a-pinch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout in_a_pinch (monorepo path)
        uses: actions/checkout@v4
        with:
          path: micro-applications/in-a-pinch

      - name: Checkout symlfy-baas (sibling of micro-applications/)
        uses: actions/checkout@v4
        with:
          repository: bengrisinger-lgtm/symlfy-baas
          path: symlfy-baas
          token: ${{ secrets.SYMLFY_BAAS_GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify layout (same as local GrizzTeam tree)
        run: |
          test -f symlfy-baas/syml-platform/client-sdk/package.json
          test -f "${{ env.IAP_ROOT }}/storefront/package.json"
          test -f "${{ env.IAP_ROOT }}/storefront/deploy.ps1"
          ls -la symlfy-baas/syml-platform/client-sdk/dist/ | head -20
          bash "${{ env.IAP_ROOT }}/scripts/verify-symlfy-baas-layout.sh" "${{ github.workspace }}/symlfy-baas"

      - name: Build storefront (deploy.ps1 -Build)
        working-directory: ${{ env.IAP_ROOT }}/storefront
        run: |
          npm install
          npm test
          npm run build

      - name: Upload hub bucket
        if: inputs.target == 'hub' || inputs.target == 'both'
        run: |
          BUCKET="gs://${GCP_PROJECT}-ta-${IAP_TENANT_SLUG}-hub-app"
          gcloud storage rsync --recursive --delete-unmatched-destination-objects \
            "${{ env.IAP_ROOT }}/storefront/dist" "$BUCKET" --exclude='^catalog-media/.*'
          if [[ -f "${{ env.IAP_ROOT }}/storefront/console-dist/index.html" ]]; then
            gcloud storage rsync --recursive --delete-unmatched-destination-objects \
              "${{ env.IAP_ROOT }}/storefront/console-dist" "$BUCKET/console"
          fi

      - name: Upload apex bucket
        if: inputs.target == 'apex' || inputs.target == 'both'
        run: |
          BUCKET="gs://${GCP_PROJECT}-ta-${IAP_TENANT_SLUG}-coming-soon-app"
          gcloud storage rsync --recursive --delete-unmatched-destination-objects \
            "${{ env.IAP_ROOT }}/storefront/dist" "$BUCKET" --exclude='^catalog-media/.*'
